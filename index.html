<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>MECH PARTS FRONTIER — Custom Hangar v0.1</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; font-family: 'Courier New', monospace; }
  body { background: #02010a; color: #cfe9ff; }
  #stage { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  canvas { display: block; }

  #header {
    position: absolute; top: 0; left: 0; right: 0; padding: 14px 22px;
    background: linear-gradient(180deg, rgba(0, 20, 40, 0.92), rgba(0, 20, 40, 0));
    z-index: 10; pointer-events: none;
    display: flex; justify-content: space-between; align-items: center;
  }
  #title {
    font-size: 22px; font-weight: 900; letter-spacing: 4px;
    color: #00ffff; text-shadow: 0 0 10px #00ffff, 0 0 20px #0088ff;
  }
  #title .sub {
    font-size: 11px; color: #ff44aa; text-shadow: 0 0 8px #ff44aa;
    margin-left: 12px; letter-spacing: 2px;
  }
  #tag {
    font-size: 11px; color: #88ccff; letter-spacing: 2px;
    border: 1px solid rgba(0, 255, 255, 0.4); padding: 4px 10px;
    background: rgba(0, 50, 100, 0.3);
  }
  #tag .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #00ff88; box-shadow: 0 0 8px #00ff88; margin-right: 6px;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  #slots {
    position: absolute; bottom: 24px; left: 24px; z-index: 10;
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
    background: rgba(0, 10, 20, 0.85); padding: 12px;
    border: 1px solid rgba(0, 255, 255, 0.4);
    box-shadow: 0 0 20px rgba(0, 255, 255, 0.2), inset 0 0 20px rgba(0, 255, 255, 0.05);
  }
  #slots::before {
    content: 'PART SLOTS'; position: absolute; top: -10px; left: 12px;
    font-size: 10px; color: #00ffff; background: #02010a; padding: 0 8px; letter-spacing: 2px;
  }
  .slot-btn {
    width: 110px; padding: 8px 10px; background: rgba(0, 30, 60, 0.7);
    border: 1px solid rgba(0, 200, 255, 0.5); color: #cfe9ff;
    cursor: pointer; transition: all 0.15s; text-align: left;
    font-family: inherit; font-size: 11px;
  }
  .slot-btn:hover { background: rgba(0, 100, 200, 0.6); border-color: #00ffff; }
  .slot-btn.active {
    background: rgba(255, 68, 170, 0.3); border-color: #ff44aa;
    box-shadow: 0 0 12px rgba(255, 68, 170, 0.6);
  }
  .slot-btn .slot-name { font-size: 9px; color: #88ccff; letter-spacing: 2px; }
  .slot-btn .slot-part { font-size: 12px; color: #ffffff; font-weight: bold; margin-top: 2px; text-shadow: 0 0 4px #00ffff; }

  #parts-panel {
    position: absolute; top: 70px; right: 24px; width: 320px; max-height: 70vh;
    background: rgba(0, 10, 20, 0.92);
    border: 1px solid rgba(0, 255, 255, 0.4);
    box-shadow: 0 0 20px rgba(0, 255, 255, 0.2), inset 0 0 20px rgba(0, 255, 255, 0.05);
    z-index: 10; overflow-y: auto; display: none;
  }
  #parts-panel.show { display: block; }
  #parts-panel-header {
    padding: 12px 16px; background: linear-gradient(90deg, rgba(0, 100, 200, 0.3), transparent);
    border-bottom: 1px solid rgba(0, 255, 255, 0.3);
    font-size: 14px; color: #00ffff; letter-spacing: 3px;
    position: sticky; top: 0;
  }
  #parts-panel-header .ja { font-size: 10px; color: #88ccff; margin-left: 8px; letter-spacing: 1px; }
  .part-item {
    padding: 12px 16px; border-bottom: 1px solid rgba(0, 200, 255, 0.1);
    cursor: pointer; transition: all 0.15s;
  }
  .part-item:hover { background: rgba(0, 100, 200, 0.3); }
  .part-item.selected { background: rgba(255, 68, 170, 0.2); border-left: 3px solid #ff44aa; }
  .part-item .pname { font-size: 13px; color: #ffffff; font-weight: bold; }
  .part-item .pdesc { font-size: 10px; color: #88ccff; margin-top: 4px; }
  .part-item .pstats { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .pstat { font-size: 9px; padding: 2px 6px; background: rgba(0, 200, 255, 0.15); border: 1px solid rgba(0, 200, 255, 0.3); color: #cfe9ff; }
  .rarity-tag { display: inline-block; font-size: 9px; padding: 1px 5px; margin-left: 6px; letter-spacing: 1px; }
  .rarity-common { background: #445566; color: #fff; }
  .rarity-uncommon { background: #228844; color: #fff; }
  .rarity-rare { background: #2266aa; color: #fff; }
  .rarity-epic { background: #aa2299; color: #fff; }

  #status {
    position: absolute; top: 70px; left: 24px; width: 280px;
    background: rgba(0, 10, 20, 0.92);
    border: 1px solid rgba(0, 255, 255, 0.4);
    box-shadow: 0 0 20px rgba(0, 255, 255, 0.2), inset 0 0 20px rgba(0, 255, 255, 0.05);
    padding: 14px; z-index: 10; font-size: 11px;
  }
  #status::before {
    content: 'STATUS'; position: absolute; top: -10px; left: 12px;
    font-size: 10px; color: #00ffff; background: #02010a; padding: 0 8px; letter-spacing: 2px;
  }
  .stat-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed rgba(0, 200, 255, 0.1); }
  .stat-label { color: #88ccff; letter-spacing: 1px; }
  .stat-value { color: #ffffff; font-weight: bold; }
  .stat-value.good { color: #00ff88; text-shadow: 0 0 4px #00ff88; }
  .stat-value.bad { color: #ff4488; text-shadow: 0 0 4px #ff4488; }
  .bar { height: 6px; background: rgba(0, 200, 255, 0.1); border: 1px solid rgba(0, 200, 255, 0.3); margin-top: 2px; position: relative; overflow: hidden; }
  .bar-fill { height: 100%; background: linear-gradient(90deg, #00aaff, #00ffff); box-shadow: 0 0 6px #00ffff; transition: width 0.3s; }
  .bar-fill.over { background: linear-gradient(90deg, #ff2244, #ff4488); box-shadow: 0 0 6px #ff4488; }

  #warning {
    position: absolute; bottom: 24px; right: 24px; z-index: 20;
    background: rgba(80, 0, 0, 0.9); border: 2px solid #ff2244;
    padding: 12px 20px; color: #ffaaaa; font-size: 13px;
    box-shadow: 0 0 20px rgba(255, 68, 68, 0.6);
    display: none;
  }
  #warning.show { display: block; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.3); }
  ::-webkit-scrollbar-thumb { background: rgba(0, 200, 255, 0.4); }
</style>
</head>
<body>
<div id="stage"></div>

<div id="header">
  <div id="title">MECH PARTS FRONTIER<span class="sub">// CUSTOM HANGAR v0.1</span></div>
  <div id="tag"><span class="dot"></span>SYSTEM ONLINE</div>
</div>

<div id="status">
  <div class="stat-row"><span class="stat-label">HP</span><span class="stat-value good" id="stat-hp">-</span></div>
  <div class="bar"><div class="bar-fill" id="bar-hp" style="width:0%"></div></div>
  <div class="stat-row" style="margin-top:8px"><span class="stat-label">装甲</span><span class="stat-value" id="stat-armor">-</span></div>
  <div class="stat-row"><span class="stat-label">火力</span><span class="stat-value" id="stat-attack">-</span></div>
  <div class="stat-row"><span class="stat-label">命中</span><span class="stat-value" id="stat-accuracy">-</span></div>
  <div class="stat-row"><span class="stat-label">速度</span><span class="stat-value" id="stat-speed">-</span></div>
  <div class="stat-row"><span class="stat-label">EN容量</span><span class="stat-value" id="stat-en">-</span></div>
  <div class="stat-row" style="margin-top:10px"><span class="stat-label">重量</span><span class="stat-value" id="stat-weight">-</span></div>
  <div class="bar"><div class="bar-fill" id="bar-weight" style="width:0%"></div></div>
</div>

<div id="slots">
  <button class="slot-btn" data-slot="head"><div class="slot-name">HEAD 頭部</div><div class="slot-part" id="slot-head">-</div></button>
  <button class="slot-btn" data-slot="body"><div class="slot-name">BODY 胴体</div><div class="slot-part" id="slot-body">-</div></button>
  <button class="slot-btn" data-slot="rightArm"><div class="slot-name">R-ARM 右腕</div><div class="slot-part" id="slot-rightArm">-</div></button>
  <button class="slot-btn" data-slot="leftArm"><div class="slot-name">L-ARM 左腕</div><div class="slot-part" id="slot-leftArm">-</div></button>
  <button class="slot-btn" data-slot="legs"><div class="slot-name">LEGS 脚部</div><div class="slot-part" id="slot-legs">-</div></button>
  <button class="slot-btn" data-slot="backpack"><div class="slot-name">B.PACK BP</div><div class="slot-part" id="slot-backpack">-</div></button>
  <button class="slot-btn" data-slot="weapon"><div class="slot-name">WEAPON 武器</div><div class="slot-part" id="slot-weapon">-</div></button>
</div>

<div id="parts-panel">
  <div id="parts-panel-header"><span id="panel-title">HEAD</span><span class="ja">/ パーツ選択</span></div>
  <div id="parts-list"></div>
</div>

<div id="warning">⚠ 重量オーバー！</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
console.log('[MPF] start');

// ===== データ =====
var SLOTS = ['head', 'body', 'rightArm', 'leftArm', 'legs', 'backpack', 'weapon'];
var SLOT_JA = { head:'頭部', body:'胴体', rightArm:'右腕', leftArm:'左腕', legs:'脚部', backpack:'BP', weapon:'武器' };

function mk(id, name, hp, w, opts) {
  opts = opts || {};
  return Object.assign({
    id: id, name: name, hp: hp, weight: w,
    color: 0x4455aa, emissive: 0x223388, emissiveIntensity: 0.3, shape: 'standard',
    rarity: 'common'
  }, opts);
}

var HEADS = {
  head_std_001: mk('head_std_001', '標準センサー頭部', 30, 8, { accuracy: 60, color: 0x4488cc }),
  head_sniper_001: mk('head_sniper_001', '高精度スナイパー頭部', 20, 9, { accuracy: 95, color: 0x44ddaa, emissiveIntensity: 0.6, shape: 'sniper', rarity: 'rare' }),
  head_radar_001: mk('head_radar_001', '広域レーダー頭部', 25, 10, { accuracy: 70, color: 0xaa44ff, shape: 'radar', rarity: 'rare' }),
  head_heavy_001: mk('head_heavy_001', '重装甲頭部', 50, 18, { accuracy: 55, color: 0x888899, shape: 'heavy', rarity: 'uncommon' })
};
var BODIES = {
  body_std_001: mk('body_std_001', '標準フレーム胴体', 100, 30, { armor: 20, enCap: 100 }),
  body_light_001: mk('body_light_001', '軽量胴体', 70, 18, { armor: 10, enCap: 90, shape: 'slim', rarity: 'uncommon' }),
  body_heavy_001: mk('body_heavy_001', '重装甲胴体', 180, 55, { armor: 45, enCap: 120, shape: 'heavy', rarity: 'uncommon' }),
  body_power_001: mk('body_power_001', '高出力コア胴体', 120, 45, { armor: 25, enCap: 180, color: 0xffaa22, emissiveIntensity: 0.8, rarity: 'rare' })
};
var ARMS = {
  arm_standard_001: mk('arm_standard_001', '標準多目的腕', 40, 12, { melee: 20 }),
  arm_mg_001: mk('arm_mg_001', 'マシンガン腕', 35, 14, { melee: 10, accuracy: 65, shape: 'gun', color: 0x888844 }),
  arm_cannon_001: mk('arm_cannon_001', 'キャノン腕', 45, 28, { melee: 15, accuracy: 70, shape: 'cannon', color: 0xaa6633, rarity: 'rare' }),
  arm_blade_001: mk('arm_blade_001', 'ブレード腕', 38, 10, { melee: 65, shape: 'blade', color: 0xcc3344, rarity: 'rare' }),
  arm_shield_001: mk('arm_shield_001', 'シールド腕', 60, 18, { melee: 8, shape: 'shield' })
};
var LEGS = {
  legs_biped_001: mk('legs_biped_001', '標準二脚', 60, 25, { speed: 50, shape: 'biped' }),
  legs_reverse_001: mk('legs_reverse_001', '逆関節脚', 50, 20, { speed: 75, shape: 'reverse', color: 0xaa4488, rarity: 'uncommon' }),
  legs_tank_001: mk('legs_tank_001', 'タンク脚', 120, 60, { speed: 30, shape: 'tank', color: 0x555566 }),
  legs_hover_001: mk('legs_hover_001', 'ホバー脚', 45, 15, { speed: 65, shape: 'hover', color: 0x44ddcc, rarity: 'rare' })
};
var BACKPACKS = {
  bp_std_001: mk('bp_std_001', '標準ブースター', 30, 10, { boost: 50 }),
  bp_highmob_001: mk('bp_highmob_001', '高機動ブースター', 25, 12, { boost: 90, shape: 'thruster', color: 0xff4488, rarity: 'rare' }),
  bp_missile_001: mk('bp_missile_001', 'ミサイルポッド', 35, 20, { shape: 'missile', color: 0xcc4422, rarity: 'rare' }),
  bp_battery_001: mk('bp_battery_001', '追加バッテリー', 28, 18, { shape: 'battery', color: 0x22ddff, rarity: 'uncommon' })
};
var WEAPONS = {
  wpn_none: mk('wpn_none', '装備なし', 0, 0, { shape: 'none' }),
  wpn_rifle_001: mk('wpn_rifle_001', 'アサルトライフル', 10, 8, { attack: 22, accuracy: 70, shape: 'rifle' }),
  wpn_shotgun_001: mk('wpn_shotgun_001', 'ショットガン', 12, 10, { attack: 38, accuracy: 50, shape: 'shotgun', color: 0xaa7744 }),
  wpn_sniper_001: mk('wpn_sniper_001', 'スナイパーライフル', 8, 12, { attack: 60, accuracy: 95, shape: 'sniper', color: 0x44ff99, rarity: 'rare' }),
  wpn_laser_001: mk('wpn_laser_001', 'レーザー砲', 9, 9, { attack: 28, accuracy: 80, shape: 'laser', color: 0xff2244, emissiveIntensity: 0.9, rarity: 'rare' })
};

var PARTS_DB = { head: HEADS, body: BODIES, rightArm: ARMS, leftArm: ARMS, legs: LEGS, backpack: BACKPACKS, weapon: WEAPONS };
var DEFAULT_LOADOUT = {
  head: 'head_std_001', body: 'body_std_001', rightArm: 'arm_mg_001',
  leftArm: 'arm_shield_001', legs: 'legs_biped_001', backpack: 'bp_std_001', weapon: 'wpn_rifle_001'
};

console.log('[MPF] data loaded');

// ===== ビルダー =====
function mat(color, emissive, ei) {
  return new THREE.MeshStandardMaterial({
    color: color, emissive: emissive || 0x000000, emissiveIntensity: ei || 0,
    metalness: 0.85, roughness: 0.3
  });
}

function buildMech(lo) {
  var g = new THREE.Group();
  // 胴体
  var bd = PARTS_DB.body[lo.body];
  var bodyGeo = bd.shape === 'heavy' ? new THREE.BoxGeometry(1.3, 1.4, 0.85) : (bd.shape === 'slim' ? new THREE.BoxGeometry(0.95, 1.4, 0.65) : new THREE.BoxGeometry(1.1, 1.4, 0.75));
  var body = new THREE.Mesh(bodyGeo, mat(bd.color, bd.emissive, bd.emissiveIntensity));
  g.add(body);
  // コア
  var core = new THREE.Mesh(new THREE.SphereGeometry(0.18, 12, 12), new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x00ffff, emissiveIntensity: 2.5 }));
  core.position.set(0, 0.3, 0.55);
  g.add(core);
  g.userData.core = core;
  // 頭
  var hd = PARTS_DB.head[lo.head];
  var head = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.55, 0.6), mat(hd.color, hd.emissive, hd.emissiveIntensity));
  head.position.y = 1.4;
  g.add(head);
  var visor = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.15, 0.08), new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x00ffff, emissiveIntensity: 1.8 }));
  visor.position.set(0, 1.45, 0.32);
  g.add(visor);
  if (hd.shape === 'sniper') {
    var scope = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.4, 8), new THREE.MeshStandardMaterial({ color: 0x222233, metalness: 0.9 }));
    scope.rotation.z = Math.PI / 2;
    scope.position.set(0, 1.6, 0.35);
    g.add(scope);
  } else if (hd.shape === 'radar') {
    var dish = new THREE.Mesh(new THREE.SphereGeometry(0.25, 12, 8, 0, Math.PI * 2, 0, Math.PI / 2), mat(hd.color, hd.emissive, hd.emissiveIntensity));
    dish.position.set(0, 1.8, 0);
    g.add(dish);
  } else if (hd.shape === 'heavy') {
    var arm = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.3, 0.7), mat(hd.color, hd.emissive, (hd.emissiveIntensity||0)*0.5));
    arm.position.set(0, 1.3, 0);
    g.add(arm);
  }
  // 腕
  ['rightArm', 'leftArm'].forEach(function(slot, idx) {
    var a = PARTS_DB[slot][lo[slot]];
    var sign = idx === 0 ? 1 : -1;
    var armGroup = new THREE.Group();
    armGroup.position.set(sign * 1.0, 0.3, 0);
    if (idx === 1) armGroup.rotation.y = Math.PI;
    if (a.shape === 'cannon') {
      armGroup.add(new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.5, 0.4), mat(a.color, a.emissive, a.emissiveIntensity)));
      var barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.22, 1.4, 10), new THREE.MeshStandardMaterial({ color: 0x333344, metalness: 0.95 }));
      barrel.rotation.x = Math.PI / 2; barrel.position.set(0, 0, 0.7);
      armGroup.add(barrel);
    } else if (a.shape === 'blade') {
      armGroup.add(new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.5, 0.3), mat(a.color, a.emissive, a.emissiveIntensity)));
      var blade = new THREE.Mesh(new THREE.BoxGeometry(0.08, 1.0, 0.25), new THREE.MeshStandardMaterial({ color: 0xdd3344, emissive: 0xaa1122, emissiveIntensity: 0.6, metalness: 1 }));
      blade.position.set(0, 0.7, 0.3);
      armGroup.add(blade);
    } else if (a.shape === 'shield') {
      armGroup.add(new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.5, 0.3), mat(a.color, a.emissive, a.emissiveIntensity)));
      var sh = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.7, 0.1), mat(0x4488cc, 0x224488, 0.5));
      sh.position.set(0, 0, 0.35);
      armGroup.add(sh);
    } else if (a.shape === 'gun') {
      armGroup.add(new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.5, 0.35), mat(a.color, a.emissive, a.emissiveIntensity)));
      var gb = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.8, 8), new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 0.95 }));
      gb.rotation.x = Math.PI / 2; gb.position.set(0, 0, 0.5);
      armGroup.add(gb);
    } else {
      armGroup.add(new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.5, 0.3), mat(a.color, a.emissive, a.emissiveIntensity)));
    }
    g.add(armGroup);
  });
  // 脚
  var lg = PARTS_DB.legs[lo.legs];
  if (lg.shape === 'tank') {
    var tread = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.5, 0.9), new THREE.MeshStandardMaterial({ color: 0x333344, metalness: 0.9 }));
    tread.position.y = -1.0; g.add(tread);
  } else if (lg.shape === 'hover') {
    for (var hx = -1; hx <= 1; hx += 2) {
      var pod = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 0.6, 8), mat(lg.color, lg.emissive, lg.emissiveIntensity));
      pod.position.set(hx * 0.35, -1.0, 0);
      g.add(pod);
    }
  } else {
    for (var lx = -1; lx <= 1; lx += 2) {
      var leg = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1.0, 0.3), mat(lg.color, lg.emissive, lg.emissiveIntensity));
      leg.position.set(lx * 0.3, -1.2, 0);
      g.add(leg);
      var foot = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.15, 0.5), mat(lg.color, lg.emissive, lg.emissiveIntensity));
      foot.position.set(lx * 0.3, -1.75, 0.1);
      g.add(foot);
    }
  }
  // BP
  var bp = PARTS_DB.backpack[lo.backpack];
  var bpMesh = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.9, 0.35), mat(bp.color, bp.emissive, bp.emissiveIntensity));
  bpMesh.position.set(0, 0.3, -0.55);
  g.add(bpMesh);
  if (bp.shape === 'thruster') {
    for (var tx = -1; tx <= 1; tx += 2) {
      var noz = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.28, 0.5, 10), new THREE.MeshStandardMaterial({ color: 0x222233, metalness: 0.95 }));
      noz.rotation.x = Math.PI / 2;
      noz.position.set(tx * 0.3, 0.3, -0.9);
      g.add(noz);
    }
  } else if (bp.shape === 'missile') {
    for (var mi = 0; mi < 4; mi++) {
      var missile = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.5, 6), new THREE.MeshStandardMaterial({ color: 0xaa3322, emissive: 0x661100, emissiveIntensity: 0.4 }));
      missile.rotation.x = Math.PI / 2;
      missile.position.set(mi < 2 ? -0.25 : 0.25, (mi % 2 === 0 ? 0.55 : 0.05), -0.75);
      g.add(missile);
    }
  }
  // 武器
  var wp = PARTS_DB.weapon[lo.weapon];
  if (wp.shape !== 'none') {
    var wm = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, 0.9), mat(wp.color, wp.emissive, wp.emissiveIntensity));
    wm.position.set(0.55, 0.3, 0.85);
    g.add(wm);
  }
  return g;
}

console.log('[MPF] builder defined');

// ===== ステータス計算 =====
function calcStats(lo) {
  var s = { hp: 0, armor: 0, attack: 0, accuracy: 0, speed: 0, en: 0, weight: 0 };
  s.hp += PARTS_DB.head[lo.head].hp + PARTS_DB.body[lo.body].hp + PARTS_DB.rightArm[lo.rightArm].hp + PARTS_DB.leftArm[lo.leftArm].hp + PARTS_DB.legs[lo.legs].hp + PARTS_DB.backpack[lo.backpack].hp + PARTS_DB.weapon[lo.weapon].hp;
  s.armor = PARTS_DB.body[lo.body].armor || 0;
  s.attack = (PARTS_DB.rightArm[lo.rightArm].melee || 0) + (PARTS_DB.leftArm[lo.leftArm].melee || 0) + (PARTS_DB.weapon[lo.weapon].attack || 0);
  s.accuracy = PARTS_DB.head[lo.head].accuracy + (PARTS_DB.weapon[lo.weapon].accuracy || 0);
  s.speed = PARTS_DB.legs[lo.legs].speed;
  s.en = PARTS_DB.body[lo.body].enCap;
  s.weight = PARTS_DB.head[lo.head].weight + PARTS_DB.body[lo.body].weight + PARTS_DB.rightArm[lo.rightArm].weight + PARTS_DB.leftArm[lo.leftArm].weight + PARTS_DB.legs[lo.legs].weight + PARTS_DB.backpack[lo.backpack].weight + PARTS_DB.weapon[lo.weapon].weight;
  s.weightCap = PARTS_DB.body[lo.body].weight * 2 + PARTS_DB.legs[lo.legs].weight * 1.5 + 30;
  s.overWeight = s.weight > s.weightCap;
  return s;
}

function updateStatusUI(lo) {
  var s = calcStats(lo);
  document.getElementById('stat-hp').textContent = s.hp;
  document.getElementById('stat-armor').textContent = s.armor;
  document.getElementById('stat-attack').textContent = s.attack;
  document.getElementById('stat-accuracy').textContent = s.accuracy;
  document.getElementById('stat-speed').textContent = s.speed;
  document.getElementById('stat-en').textContent = s.en;
  document.getElementById('stat-weight').textContent = s.weight + ' / ' + Math.round(s.weightCap);
  document.getElementById('bar-hp').style.width = Math.min(100, s.hp / 3) + '%';
  var wPct = Math.min(100, (s.weight / s.weightCap) * 100);
  var wBar = document.getElementById('bar-weight');
  wBar.style.width = wPct + '%';
  wBar.className = 'bar-fill' + (s.overWeight ? ' over' : '');
  document.getElementById('warning').classList.toggle('show', s.overWeight);
  // スロット名
  SLOTS.forEach(function(slot) {
    document.getElementById('slot-' + slot).textContent = PARTS_DB[slot][lo[slot]].name;
  });
}

// ===== シーン =====
var loadout = Object.assign({}, DEFAULT_LOADOUT);
var mechObj = null;
var scene, camera, renderer, clock;
var camAngle = 0;

function init() {
  try {
    console.log('[MPF] init start');
    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x02010a, 0.04);
    camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 2.5, 7);
    camera.lookAt(0, 0, 0);
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    document.getElementById('stage').appendChild(renderer.domElement);
    console.log('[MPF] renderer added');

    // ライト
    scene.add(new THREE.AmbientLight(0x334466, 0.6));
    var key = new THREE.DirectionalLight(0xffffff, 0.8);
    key.position.set(5, 10, 5);
    key.castShadow = true;
    key.shadow.mapSize.width = 1024;
    key.shadow.mapSize.height = 1024;
    scene.add(key);
    scene.add(new THREE.PointLight(0x00ffff, 1.2, 15).translateX(-3).translateY(2).translateZ(2));
    var ml = new THREE.PointLight(0xff44aa, 1.0, 15);
    ml.position.set(3, 2, -2);
    scene.add(ml);

    // 床
    var floor = new THREE.Mesh(new THREE.CircleGeometry(5, 64), new THREE.MeshStandardMaterial({ color: 0x111122, metalness: 0.8, roughness: 0.4 }));
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -2;
    floor.receiveShadow = true;
    scene.add(floor);
    var ring = new THREE.Mesh(new THREE.RingGeometry(4.5, 4.7, 64), new THREE.MeshStandardMaterial({ color: 0x00ffff, emissive: 0x00ffff, emissiveIntensity: 2.5, side: THREE.DoubleSide }));
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = -1.99;
    scene.add(ring);

    // メカ
    rebuildMech();
    updateStatusUI(loadout);
    clock = new THREE.Clock();
    animate();
    console.log('[MPF] init done');
  } catch (e) {
    console.error('[MPF] init error:', e);
    document.body.innerHTML = '<pre style="color:red;padding:20px">INIT ERROR: ' + e.message + '\n' + e.stack + '</pre>';
  }
}

function rebuildMech() {
  if (mechObj) scene.remove(mechObj);
  mechObj = buildMech(loadout);
  mechObj.position.y = -0.5;
  scene.add(mechObj);
}

function animate() {
  requestAnimationFrame(animate);
  var dt = Math.min(clock.getDelta(), 0.1);
  camAngle += dt * 0.15;
  camera.position.x = Math.cos(camAngle) * 7;
  camera.position.z = Math.sin(camAngle) * 7;
  camera.position.y = 2.5 + Math.sin(camAngle * 2) * 0.2;
  camera.lookAt(0, 0, 0);
  if (mechObj) {
    mechObj.position.y = -0.5 + Math.sin(clock.getElapsedTime() * 1.5) * 0.08;
    if (mechObj.userData.core) {
      mechObj.userData.core.material.emissiveIntensity = 2.0 + Math.sin(clock.getElapsedTime() * 4) * 0.8;
    }
  }
  renderer.render(scene, camera);
}

// UI
document.querySelectorAll('.slot-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    var slot = this.dataset.slot;
    showPartsList(slot);
  });
});

function showPartsList(slot) {
  var panel = document.getElementById('parts-panel');
  var list = document.getElementById('parts-list');
  document.getElementById('panel-title').textContent = slot.toUpperCase() + ' / ' + SLOT_JA[slot];
  document.querySelectorAll('.slot-btn').forEach(function(b) { b.classList.toggle('active', b.dataset.slot === slot); });
  list.innerHTML = '';
  var db = PARTS_DB[slot];
  Object.keys(db).forEach(function(id) {
    var p = db[id];
    var item = document.createElement('div');
    item.className = 'part-item' + (id === loadout[slot] ? ' selected' : '');
    var stats = '';
    if (p.hp) stats += '<span class="pstat">HP+' + p.hp + '</span>';
    if (p.armor) stats += '<span class="pstat">装甲+' + p.armor + '</span>';
    if (p.attack) stats += '<span class="pstat">火力+' + p.attack + '</span>';
    if (p.melee) stats += '<span class="pstat">格闘+' + p.melee + '</span>';
    if (p.accuracy) stats += '<span class="pstat">命中+' + p.accuracy + '</span>';
    if (p.speed) stats += '<span class="pstat">速度+' + p.speed + '</span>';
    if (p.weight) stats += '<span class="pstat">重' + p.weight + '</span>';
    item.innerHTML = '<div class="pname">' + p.name + '<span class="rarity-tag rarity-' + p.rarity + '">' + p.rarity.toUpperCase() + '</span></div><div class="pdesc">' + (p.shape||'') + ' 形状</div><div class="pstats">' + stats + '</div>';
    item.onclick = function() {
      loadout[slot] = id;
      rebuildMech();
      updateStatusUI(loadout);
      showPartsList(slot);
    };
    list.appendChild(item);
  });
  panel.classList.add('show');
}

window.addEventListener('resize', function() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

console.log('[MPF] boot');
init();
</script>
</body>
</html>
